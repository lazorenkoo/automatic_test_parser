<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Створити тест</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <main class="page">
    <section id="siteNoticeCard" class="card site-notice hidden" aria-live="polite">
      <div class="site-notice-head">
        <p class="site-notice-kicker">Оголошення</p>
        <p id="siteNoticeTime" class="site-notice-time"></p>
      </div>
      <div id="siteNoticeText" class="site-notice-text"></div>
    </section>

    <section class="grid">
      <form id="quizForm" class="card form-card">
        <div class="card-head">
          <h2>Створити тест</h2>
        </div>

        <div class="title-course-row">
          <label class="field">
            <span>Курс</span>
            <select id="courseNumber" name="courseNumber" required>
              <option value="">Оберіть курс</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </label>

          <label class="field">
            <span>Назва тесту</span>
            <input
              id="clientTitle"
              name="clientTitle"
              type="text"
              placeholder="Наприклад: Терапія: Кардіологія | НБ"
              required
            />
          </label>
        </div>

        <label class="field">
          <span>Файл із тестами</span>
          <input
            id="sourceFile"
            name="sourceFile"
            type="file"
            accept=".txt,.pdf,.doc,.docx,.json,text/plain,application/pdf,application/json,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            required
          />
        </label>

        <div class="split">
          <label class="field">
            <span>Варіантів відповіді в питанні</span>
            <div class="option-count-row">
              <input id="optionCount" name="optionCount" type="number" min="2" max="6" value="5" required />
              <label class="choice-row inline-choice">
                <input id="optionCountAuto" name="optionCountAuto" type="checkbox" />
                <span>AUTO</span>
              </label>
            </div>
          </label>

          <div class="field">
            <span>Режим правильних відповідей</span>
            <div class="choice-stack">
              <label class="choice-row">
                <input id="answerModeSingle" name="answerMode" type="radio" value="single" checked />
                <span>Один і той самий варіант для всіх</span>
              </label>
              <label class="choice-row">
                <input id="answerModeFile" name="answerMode" type="radio" value="file" />
                <span>Окремий файл із відповідями</span>
              </label>
            </div>
          </div>
        </div>

        <div id="singleAnswerField" class="field">
          <span>Правильний варіант</span>
          <select id="answerIndex" name="answerIndex" required></select>
        </div>

        <label id="answerFileField" class="field hidden">
          <span>Файл із відповідями</span>
          <input
            id="answerFile"
            name="answerFile"
            type="file"
            accept=".txt,.pdf,.doc,.docx,text/plain,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          />
        </label>

        <div class="field">
          <span>Кількість питань</span>

          <label class="choice-row">
            <input id="useAllQuestions" name="useAllQuestions" type="checkbox" checked />
            <span>Усі питання</span>
          </label>

          <label id="questionLimitField" class="field nested-field hidden">
            <span>Скільки питань узяти</span>
            <input id="questionLimit" name="questionLimit" type="number" min="1" value="20" />
          </label>
        </div>

        <div class="actions-row">
          <button id="submitBtn" class="primary-btn" type="submit">Передати файл</button>
          <button id="aiCreateBtn" class="secondary-btn hidden" type="button">Знайти відповіді</button>
          <button id="reportIssueBtn" class="secondary-btn hidden" type="button">Report issue</button>
        </div>
      </form>

      <section class="card result-card">
        <div class="card-head">
          <h2>Результат</h2>
        </div>

        <div id="statusBox" class="status idle">Очікую на завантаження файла.</div>
        <div id="resultBox" class="result-box hidden"></div>
      </section>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
