<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDMU Quiz Builder</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <main class="page">
    <section class="grid">
      <form id="quizForm" class="card form-card">
        <div class="card-head">
          <h2>Создать тест</h2>
          <p>Локальный парсер читает файл и собирает готовый quiz без внешнего API.</p>
        </div>

        <label class="field">
          <span>Файл с тестами</span>
          <input id="sourceFile" name="sourceFile" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required />
        </label>

        <div class="split">
          <label class="field">
            <span>Правильный вариант</span>
            <select id="answerIndex" name="answerIndex" required></select>
          </label>

          <label class="field">
            <span>Вариантов ответа в вопросе</span>
            <input id="optionCount" name="optionCount" type="number" min="2" max="10" value="5" required />
          </label>

          <label class="field">
            <span>Сколько вопросов распарсить</span>
            <input id="questionLimit" name="questionLimit" type="number" min="1" value="20" required />
          </label>
        </div>

        <label class="field">
          <span>Одноразовый пароль</span>
          <input id="accessCode" name="accessCode" type="password" placeholder="Например: ABCD-EFGH-JKLM" required />
        </label>

        <button id="submitBtn" class="primary-btn" type="submit">Запустить обработку</button>
      </form>

      <section class="card result-card">
        <div class="card-head">
          <h2>Результат</h2>
          <p>Здесь появится готовая ссылка после обработки.</p>
        </div>

        <div id="statusBox" class="status idle">Ожидаю загрузку файла.</div>
        <div id="resultBox" class="result-box hidden"></div>
      </section>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
